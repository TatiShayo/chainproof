[package]
name = "chainproof"
version = "0.1.0"
edition = "2021"
description = "SLSA supply chain attestation verifier - native Rust CLI"

[[bin]]
name = "chainproof"
path = "rust_src/src/main.rs"

[lib]
name = "chainproof_lib"
path = "rust_src/src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
